<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Claudiu</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 0 1.25rem 4rem;
    background: radial-gradient(120% 80% at 50% 0%, #15203f 0%, #0a1228 40%, #02040a 100%);
    color: #eef2ff; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; text-align: center;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { padding: 5rem 0 2rem; }
  h1 { font-size: 2.5rem; margin: .5rem 0; letter-spacing: -0.02em; }
  .muted { color: #9aa3c0; }
  .apps { display: grid; gap: 1rem; max-width: 30rem; margin: 2rem auto; }
  .app { display:block; text-decoration:none; background: rgba(255,255,255,.05);
         border-radius: 16px; padding: 1.1rem 1.3rem; text-align:left; color:#fff; }
  .app:hover { background: rgba(255,255,255,.09); }
  .app b { font-size: 1.15rem; }
  .app span { display:block; color:#9aa3c0; font-size:.95rem; margin-top:.2rem; }
  a { color: #7d92f5; }
  footer { margin-top: 3rem; color:#9aa3c0; font-size:.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Apps by Claudiu</h1>
    <p class="muted">Small, focused apps. Privacy &amp; support live here.</p>
  </header>

  <div class="apps">
    <a class="app" href="./lumora/">
      <b>🌙 Lumora</b>
      <span>The Milky Way &amp; golden-hour planner for nightscape photographers.</span>
    </a>
  </div>

  <footer>
    <p>Support: <a href="mailto:clausewl@clausewl.com">clausewl@clausewl.com</a>
       </p>
  </footer>
</div>
</body>
</html>
